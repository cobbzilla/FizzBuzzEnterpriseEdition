name: slopbuzz

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${SLOPBUZZ_HTTP_PORT:-8080}:8080"
    environment:
      POSTHOG_TOKEN: ${POSTHOG_TOKEN:-}
      SLOPBUZZ_ANALYTICS_ENABLED: ${SLOPBUZZ_ANALYTICS_ENABLED:-false}
      SLOPBUZZ_ANALYTICS_ENVIRONMENT: ${SLOPBUZZ_ANALYTICS_ENVIRONMENT:-production}
      SLOPBUZZ_ANALYTICS_ALLOW_LOCAL: ${SLOPBUZZ_ANALYTICS_ALLOW_LOCAL:-false}
      SLOPBUZZ_REDIS_HOST: redis
      SLOPBUZZ_REDIS_PORT: "6379"
      SLOPBUZZ_AUDIT_JDBC_URL: jdbc:h2:file:/data/slopbuzz-audit;DB_CLOSE_DELAY=10
      SLOPBUZZ_RELEASE_SHA: ${SLOPBUZZ_RELEASE_SHA:-unknown}
    volumes:
      - audit-data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12

volumes:
  audit-data:
