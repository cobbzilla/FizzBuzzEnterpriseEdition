name: slopbuzz

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${SLOPBUZZ_HTTP_PORT:-8080}:8080"
    environment:
      SLOPBUZZ_REDIS_HOST: redis
      SLOPBUZZ_REDIS_PORT: "6379"
      SLOPBUZZ_AUDIT_JDBC_URL: jdbc:h2:file:/data/slopbuzz-audit;DB_CLOSE_DELAY=10
    volumes:
      - audit-data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12

volumes:
  audit-data:
