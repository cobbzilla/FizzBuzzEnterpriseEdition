server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/mime.types;
  types { application/wasm wasm; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control no-cache always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
  # First-party receiving for the bundled cookieless SDK; static files never receive these POSTs.
  location = /intake/e/ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass https://us.i.posthog.com/e/;
    proxy_ssl_server_name on;
    proxy_cache off;
    proxy_set_header Host us.i.posthog.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
  }
  location / { try_files $uri $uri/ =404; }
  # TeaVM 0.16 generates JSO wrappers inside its worker. Keep that permission out of the document.
  location ~ /runtime-worker\.js$ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
  }
  # Optional same-origin proxy for SLOPBUZZ_RUNTIME=server static deployments.
  location /java-api/ {
    resolver 127.0.0.11 valid=30s;
    set $java_origin http://host.docker.internal:18089;
    rewrite ^/java-api/(.*)$ /$1 break;
    proxy_pass $java_origin;
  }
}
